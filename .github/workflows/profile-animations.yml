name: Generate 3D Contrib & Snake Animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-animations.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Enhance 3D Graph with seamless dark background and continuous rise animation
        run: |
          python3 -c '
          import re
          p = "profile-3d-contrib/profile-night-green.svg"
          s = open(p).read()
          s = s.replace("fill: #00000f;", "fill: #0D1117;").replace("stroke: #00000f;", "stroke: #0D1117;")
          s = re.sub(r"values=\"([^;\"]+)\s*;\s*([^;\"]+)\"\s+dur=\"3s\"\s+repeatCount=\"1\"", r"values=\"\1;\2;\2;\1\" keyTimes=\"0;0.25;0.85;1\" dur=\"8s\" repeatCount=\"indefinite\"", s)
          open(p, "w").write(s)
          '

      - name: Commit & Push 3D Graph to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --staged --quiet || git commit -m "chore: update 3D contribution graph"
          git pull --rebase
          git push

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push Snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
