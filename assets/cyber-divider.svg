<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 12" width="100%" height="12">
  <defs>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00FF9C" stop-opacity="1" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="pinkGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0055" stop-opacity="0" />
      <stop offset="50%" stop-color="#FF0055" stop-opacity="1" />
      <stop offset="100%" stop-color="#BD00FF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Dark Track Line -->
  <line x1="0" y1="6" x2="800" y2="6" stroke="#1F2937" stroke-width="1.2" />

  <!-- Animated Laser Bar 1 (Cyan / Matrix Green) -->
  <rect y="4.2" width="240" height="3.6" rx="1.8" fill="url(#cyanGlow)">
    <animate attributeName="x" values="-120;680;-120" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- Animated Laser Bar 2 (Cyber Pink / Purple) -->
  <rect y="4.2" width="130" height="3.6" rx="1.8" fill="url(#pinkGlow)">
    <animate attributeName="x" values="40;740;40" dur="4s" repeatCount="indefinite" />
  </rect>
</svg>
